<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(v);
const number=v=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(v);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const pill=(text,type='neutral')=>`<span class="pill ${type}"><span class="dot"></span>${text}</span>`;
const products=[
{id:1,name:'Banano criollo',category:'Frutas',unit:'kg',price:3800,cost:2200,stock:3,target:20,min:5,code:'FR-001'},
{id:2,name:'Manzana roja',category:'Frutas',unit:'kg',price:8500,cost:5400,stock:2,target:15,min:4,code:'FR-002'},
{id:3,name:'Papaya',category:'Frutas',unit:'kg',price:4200,cost:2400,stock:12,target:20,min:5,code:'FR-003'},
{id:4,name:'Aguacate hass',category:'Frutas',unit:'und',price:4500,cost:2800,stock:18,target:35,min:8,code:'FR-004'},
{id:5,name:'Fresa',category:'Frutas',unit:'bandeja',price:6500,cost:4100,stock:0,target:15,min:4,code:'FR-005'},
{id:6,name:'Tomate chonto',category:'Verduras',unit:'kg',price:4800,cost:2800,stock:16,target:25,min:6,code:'VE-001'},
{id:7,name:'Yogurt natural',category:'Lácteos',unit:'botella',price:9000,cost:5800,stock:3,target:15,min:5,code:'LA-001'},
{id:8,name:'Arepas de maíz',category:'Minimarket',unit:'paquete',price:5500,cost:3300,stock:12,target:20,min:4,code:'MI-001'},
{id:9,name:'Pan de masa madre',category:'Minimarket',unit:'und',price:14000,cost:9000,stock:7,target:10,min:3,code:'MI-002'}
];
const combos=[{id:101,name:'La semana fresca',description:'Frutas para acompañar todos tus días.',price:35000,pack:1200,sold:12,items:[[1,2],[2,1],[3,1.5],[4,2]],color:'#e7edda'},
{id:102,name:'Desayuno en casa',description:'Un comienzo rico, sencillo y natural.',price:26000,pack:1000,sold:8,items:[[1,1],[7,1],[8,1]],color:'#f0eadb'},
{id:103,name:'Tu pausa saludable',description:'Fruta y yogurt para tu media mañana.',price:21000,pack:1000,sold:5,items:[[5,1],[7,1],[1,.5]],color:'#e6ecdf'}];
let orders=[{id:'VD-0148',customer:'Cliente de ejemplo A',channel:'Internet',amount:35000,time:'14:32',status:'Pendiente',items:'1 × La semana fresca',delivery:'Recogida en el local'},
{id:'VD-0147',customer:'Venta de mostrador',channel:'Local',amount:18500,time:'14:26',status:'Entregado',items:'Productos varios',delivery:'Local'},
{id:'VD-0146',customer:'Cliente de ejemplo B',channel:'Internet',amount:52000,time:'14:18',status:'Confirmado',items:'2 × Desayuno en casa',delivery:'Domicilio'},
{id:'VD-0145',customer:'Venta de mostrador',channel:'Local',amount:27400,time:'14:10',status:'Entregado',items:'Productos varios',delivery:'Local'},
{id:'VD-0144',customer:'Cliente de ejemplo C',channel:'Internet',amount:35000,time:'13:52',status:'Entregado',items:'1 × La semana fresca',delivery:'Recogida en el local'}];
let chartMode='week',inventoryQuery='',inventoryCategory='Todas',orderFilter='Todos',cart={},storeCategory='Todos',page='resumen',saleCart={},demoSales=0,demoCost=0,demoCash=0,demoTransfer=0,demoCard=0,lastFocus=null;
const low=()=>products.filter(p=>p.stock<=p.min);
const costCombo=c=>c.items.reduce((n,[id,q])=>n+products.find(p=>p.id===id).cost*q,0)+c.pack;
const capacity=c=>Math.min(...c.items.map(([id,q])=>Math.floor(products.find(p=>p.id===id).stock/q)));
const stockPill=p=>p.stock===0?pill('Agotado','danger'):p.stock<=p.min?pill('Bajo','warning'):pill('Disponible','positive');
const header=(title,subtitle,actions='')=>`<section class="heading between"><div><div class="eyebrow">Tu negocio, en orden</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions flex">${actions}</div></section>`;
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
function navigate(){const route=location.hash.slice(1)||'resumen';page=['resumen','inventario','combos','pedidos','caja','link','tienda'].includes(route)?route:'resumen';$('#shell').classList.toggle('standalone-store',page==='tienda');const links=[['resumen','Resumen'],['inventario','Inventario'],['combos','Combos'],['pedidos','Pedidos'],['caja','Caja'],['link','Link de venta']];$('.nav').innerHTML=links.map(([id,label])=>`<a href="#${id}" ${id===page?'class="active" aria-current="page"':''}>${label}${id==='pedidos'?'<span class="nav-count">2</span>':''}</a>`).join('');$('#main').className='page';$('#main').innerHTML=({resumen:dashboard,inventario:inventory,combos:comboPage,pedidos:orderPage,caja:cashPage,link:storePage,tienda:storePage}[page])();document.title=`Verdélia · ${page==='tienda'?'Link de venta':links.find(x=>x[0]===page)?.[1]||'Resumen'}`;}
function dashboard(){return `${header('Así va Verdélia','Domingo, 1 de noviembre de 2026',`<span class="select date-select">Hoy · 1 nov</span><button class="btn primary" onclick="newSale()">${icon('plus')}Nueva venta</button>`)}
<div class="summary-grid"><section class="card sales-card"><div class="cardhead"><h2 class="label-icon">${icon('wallet')}Ventas de hoy</h2><span class="pill neutral">COP</span></div><div class="amount num"><span class="currency">$</span>${number(1286400+demoSales)}</div><div class="flex"><span class="pill positive">${icon('diagonal')}12,8 %</span><span class="small muted">frente al domingo anterior</span></div><div class="sales-bottom"><div class="metric-mini"><span class="muted small">${icon('store')} En el local</span><strong class="num">${money(914400+demoSales)}</strong></div><div class="metric-mini"><span class="muted small">${icon('link')} Por internet</span><strong class="num">${money(372000)}</strong></div><a href="#pedidos" class="btn" style="margin-left:auto">Ver ventas ${icon('arrow')}</a></div></section>
<section class="card profit-card"><div class="cardhead"><h2>Tu ganancia estimada</h2><span class="pill outline">Hoy</span></div><div class="amount num">${money(360000+demoSales-demoCost)}</div><p class="small muted">Después de costos, gastos y pérdidas.</p><div class="profit-footer"><div class="profit-cell">Costo de lo vendido<strong class="num">${money(791400+demoCost)}</strong></div><div class="profit-cell">Gastos y pérdidas<strong class="num">${money(135000)}</strong></div></div></section></div>
<div class="row2"><section class="card"><div class="cardhead"><h2 class="label-icon">${icon('chart')}Ritmo de ventas</h2><div class="segmented" aria-label="Período del gráfico"><button onclick="chartMode='week';navigate()" class="${chartMode==='week'?'active':''}">7 días</button><button onclick="chartMode='day';navigate()" class="${chartMode==='day'?'active':''}">Hoy</button></div></div><div class="between chart-summary"><span class="num" style="font-size:25px">${money(chartMode==='week'?7436200+demoSales:1286400+demoSales)}</span><div class="flex"><span class="legend"><i></i>Local</span><span class="legend"><i class="lime"></i>Internet</span></div></div>${chart()}</section>
<section class="card"><div class="cardhead"><h2 class="label-icon">${icon('box')}Para reponer</h2>${pill(low().length+' productos','warning')}</div><div>${low().slice(0,3).map(p=>`<div class="stockrow"><div class="initial">${p.name.slice(0,2)}</div><div class="stock-info"><p>${p.name}</p><small>${p.stock?`Quedan ${number(p.stock)} ${p.unit}`:'Sin existencias'}</small></div><div class="stockcost">${money((p.target-p.stock)*p.cost)}<div class="small muted">${p.target-p.stock} ${p.unit} por comprar</div></div></div>`).join('')}</div><div class="cardfoot"><span class="muted">Inversión estimada <strong style="color:var(--ink)">${money(low().reduce((n,p)=>n+(p.target-p.stock)*p.cost,0))}</strong></span><button class="textbtn" onclick="replenish()">Ver lista ${icon('arrow')}</button></div></section></div>
<div class="bottom-grid"><section class="card table-card"><div class="cardhead"><h2>Actividad reciente</h2><a href="#pedidos" class="textbtn">Ver todos ${icon('arrow')}</a></div>${orderTable(orders.slice(0,4),true)}</section><section class="card"><div class="cardhead"><h2>Lo que más se vende</h2><span class="small muted">Esta semana</span></div>${[['Banano criollo','42 kg vendidos',100,'$159.600'],['La semana fresca','12 combos vendidos',75,'$420.000'],['Aguacate hass','28 unidades vendidas',55,'$126.000']].map((p,i)=>`<div class="top-product"><span class="rank">0${i+1}</span><div class="grow"><div class="between"><p>${p[0]}</p><span class="small">${p[3]}</span></div><small>${p[1]}</small><div class="progress"><span style="width:${p[2]}%"></span></div></div></div>`).join('')}</section></div>`}
function chart(){const vals=chartMode==='week'?[824300,1135000,948500,1091000,974000,1177000,1286400+demoSales]:[74000,128000,184500,268500,284000,347400+demoSales];const labels=chartMode==='week'?['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']:['08 h','09 h','10 h','11 h','12 h','14 h'];const max=chartMode==='week'?1500000:400000;return `<div class="chart" role="img" aria-label="Ventas ${chartMode==='week'?'de los últimos siete días':'de hoy por hora'}. Total ${money(vals.reduce((a,b)=>a+b,0))}"><div class="chart-y"><span>${chartMode==='week'?'$1,5 M':'$400 mil'}</span><span>${chartMode==='week'?'$750 mil':'$200 mil'}</span><span>$0</span></div><div class="chart-plot">${vals.map((v,i)=>`<div class="bar-col"><div class="chart-tip">${labels[i]} · ${money(v)}</div><div class="bar-stack" style="height:${Math.min(v/max*100,100)}%"><span style="height:${20+i*1.5}%"></span><span></span></div><span class="bar-label">${labels[i]}</span></div>`).join('')}</div></div>`}
function inventory(){return `${header('Inventario','Cada producto, su precio y lo que tienes disponible.',`<button class="btn" onclick="replenish()">${icon('download')}Lista de compra</button><button class="btn primary" onclick="productForm()">${icon('plus')}Producto</button>`)}<div class="stats-strip"><div class="stat-small"><p>Productos registrados</p><strong>${products.length.toString().padStart(2,'0')}</strong></div><div class="stat-small"><p>Valor al costo</p><strong class="num">${money(products.reduce((n,p)=>n+p.cost*p.stock,0))}</strong></div><div class="stat-small"><p>Necesitan reposición</p><strong>${low().length.toString().padStart(2,'0')}</strong></div><div class="stat-small"><p>Sin existencias</p><strong>${products.filter(p=>p.stock===0).length.toString().padStart(2,'0')}</strong></div></div><div class="toolbar"><label class="search">${icon('search')}<input aria-label="Buscar producto" placeholder="Buscar producto o código…" value="${esc(inventoryQuery)}" oninput="inventoryQuery=this.value;updateInventory()"></label><div class="flex"><select aria-label="Categoría de productos" class="select" onchange="inventoryCategory=this.value;updateInventory()">${['Todas','Frutas','Verduras','Lácteos','Minimarket','Bajo'].map(c=>`<option ${c===inventoryCategory?'selected':''}>${c}</option>`).join('')}</select><button class="btn" onclick="inventoryCategory='Bajo';navigate()">${icon('box')}Stock bajo</button></div></div><section class="card table-card" style="padding-top:0"><div id="inventory-table">${inventoryTable()}</div><p class="card-note">Las compras, ventas y pérdidas actualizarán estas existencias en el sistema final.</p></section>`}
function inventoryTable(){const ps=products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(inventoryQuery.toLowerCase())&&(inventoryCategory==='Todas'||inventoryCategory==='Bajo'&&p.stock<=p.min||p.category===inventoryCategory));return `<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Costo / medida</th><th>Precio de venta</th><th>Existencias</th><th>Estado</th><th class="right">Acción</th></tr></thead><tbody>${ps.map(p=>`<tr><td><div class="product-name"><div class="initial">${esc(p.name.slice(0,2))}</div><div><strong>${esc(p.name)}</strong><small>${p.code} · Por ${esc(p.unit)}</small></div></div></td><td class="muted">${esc(p.category)}</td><td>${money(p.cost)}</td><td class="strong">${money(p.price)} <span class="small muted">/ ${esc(p.unit)}</span></td><td>${number(p.stock)} ${esc(p.unit)}<div class="stock-meter"><span class="${p.stock<=p.min?'low':''}" style="width:${Math.min(100,p.stock/p.target*100)}%"></span></div></td><td>${stockPill(p)}</td><td class="right"><button class="textbtn" onclick="productForm(${p.id})">Editar ${icon('edit')}</button></td></tr>`).join('')}</tbody></table>${ps.length?'':'<div class="empty">No hay productos con estos filtros.</div>'}</div>`}
function updateInventory(){$('#inventory-table').innerHTML=inventoryTable()}
function comboPage(){return `${header('Combos que suman','Agrupa productos. Conoce su costo, disponibilidad y ganancia.',`<button class="btn primary" onclick="comboBuilder()">${icon('plus')}Crear combo</button>`)}<div class="banner">${icon('box')}<span><strong>Un solo inventario.</strong> Cada combo utiliza las existencias de sus ingredientes.</span></div><div class="combo-grid">${combos.map(c=>`<article class="combo-card"><div class="combo-art" style="background:${c.color}">${pill(capacity(c)>0?'Disponible en el link':'Sin disponibilidad',capacity(c)>0?'positive':'danger')}<svg aria-hidden="true"><use href="#fruit-art"/></svg></div><div class="combo-content"><h2>${esc(c.name)}</h2><p>${esc(c.description)}</p><div class="combo-price num">${money(c.price)}<small>por combo</small></div><div class="combo-finance"><div><span>Costo total</span><strong>${money(costCombo(c))}</strong></div><div><span>Ganancia bruta</span><strong style="color:var(--green)">${money(c.price-costCombo(c))}</strong></div></div><div class="between"><span class="small muted">${c.sold} vendidos · ${capacity(c)} disponibles</span><button class="btn" onclick="comboDetail(${c.id})">Ver receta ${icon('arrow')}</button></div></div></article>`).join('')}</div>`}
function orderTable(list,compact=false){return `<div class="table-wrap"><table><thead><tr><th>Pedido</th>${compact?'':'<th>Cliente</th>'}<th>Canal</th><th>Total</th><th>Estado</th>${compact?'':'<th></th>'}</tr></thead><tbody>${list.map(o=>`<tr><td><button class="order-id" style="padding:0" onclick="orderDetail('${o.id}')">#${o.id}</button><div class="small muted">Hoy, ${o.time}</div></td>${compact?'':`<td>${o.customer}</td>`}<td><span class="channel">${icon(o.channel==='Local'?'store':'link')}${o.channel}</span></td><td class="strong">${money(o.amount)}</td><td>${pill(o.status,o.status==='Entregado'?'positive':o.status==='Pendiente'?'warning':'neutral')}</td>${compact?'':`<td class="right"><button class="textbtn" onclick="orderDetail('${o.id}')">Abrir ${icon('arrow')}</button></td>`}</tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">No hay pedidos en este estado.</div>'}</div>`}
function orderPage(){const filtered=orders.filter(o=>orderFilter==='Todos'||o.status===orderFilter);return `${header('Pedidos y ventas','Del mostrador o de tu Link de venta. Todo en un lugar.',`<button class="btn primary" onclick="newSale()">${icon('plus')}Nueva venta</button>`)}<div class="tabs-line">${['Todos','Pendiente','Confirmado','Entregado'].map(s=>`<button class="${s===orderFilter?'active':''}" onclick="orderFilter='${s}';navigate()">${s==='Pendiente'?'Pendientes':s==='Confirmado'?'Confirmados':s==='Entregado'?'Entregados':s} <span class="small muted">${s==='Todos'?orders.length:orders.filter(o=>o.status===s).length}</span></button>`).join('')}</div><section class="card table-card" style="padding-top:0">${orderTable(filtered)}</section><p class="subtitle">Un pedido pendiente todavía no cuenta como venta ni como pago recibido.</p>`}
function cashPage(){return `${header('Caja y cuentas','Distingue lo que vendes, lo que ganas y el dinero disponible.',`<button class="btn" onclick="expenseForm()">${icon('plus')}Registrar gasto</button><button class="btn primary" onclick="closeCash()">${icon('check')}Cerrar caja</button>`)}<div class="cash-layout"><section class="card cash-balance"><div class="cardhead"><h2 class="label-icon">${icon('wallet')}Dinero disponible</h2><span class="small">COP</span></div><div class="amount num">${money(1451400+demoSales)}</div><p class="muted small">Saldo inicial + cobros − salidas</p><div class="divider" style="background:#ffffff25"></div><div class="cash-item"><span>Efectivo</span><strong>${money(689400+demoCash)}</strong></div><div class="cash-item"><span>Transferencias</span><strong>${money(562000+demoTransfer)}</strong></div><div class="cash-item"><span>Tarjeta</span><strong>${money(200000+demoCard)}</strong></div><p class="small muted" style="margin-top:20px">El saldo disponible es diferente de tu ganancia.</p></section><section class="card"><div class="cardhead"><h2>Resultado del día</h2><span class="pill neutral">1 nov 2026</span></div><div class="detail-row"><span>Ventas registradas</span><strong>${money(1286400+demoSales)}</strong></div><div class="detail-row"><span>Costo de los productos vendidos</span><strong>− ${money(791400+demoCost)}</strong></div><div class="detail-row"><span>Gastos operativos</span><strong>− ${money(119000)}</strong></div><div class="detail-row"><span>Pérdidas de inventario</span><strong>− ${money(16000)}</strong></div><div class="between" style="margin-top:24px"><h2>Ganancia estimada</h2><strong class="num" style="font-size:26px;color:var(--green)">${money(360000+demoSales-demoCost)}</strong></div><p class="subtitle">Control interno basado en los movimientos registrados.</p></section></div><section class="card table-card" style="margin-top:20px"><div class="cardhead"><h2>Entradas y salidas de dinero</h2><span class="small muted">Hoy</span></div><div class="table-wrap"><table><thead><tr><th>Concepto</th><th>Tipo</th><th>Medio</th><th class="right">Valor</th></tr></thead><tbody><tr><td>Base de caja</td><td class="muted">Saldo inicial</td><td>Efectivo</td><td class="right">$300.000</td></tr><tr><td>Cobros del día</td><td>${pill('Entrada','positive')}</td><td>Varios</td><td class="right">${money(1286400+demoSales)}</td></tr><tr><td>Servicios y transporte</td><td>${pill('Salida')}</td><td>Efectivo</td><td class="right">− $119.000</td></tr><tr><td>Retiro del dueño</td><td>${pill('Retiro')}</td><td>Efectivo</td><td class="right">− $16.000</td></tr></tbody></table></div></section>`}
function storePage(){const isPublic=page==='tienda';const items=[...combos.map(c=>({...c,unit:'combo',stock:capacity(c),category:'Combos',description:c.items.length+' ingredientes · Listo para pedir'})),...products.filter(p=>p.category==='Frutas')];const filtered=items.filter(p=>storeCategory==='Todos'||storeCategory===p.category);return `${isPublic?'':header('Tu Link de venta','Así verán tus clientes los productos y combos de Verdélia.',`<a class="btn primary" href="#tienda">${icon('diagonal')}Vista del cliente</a>`)}${isPublic?'':`<div class="link-admin">${icon('link')}<strong>Catálogo de Verdélia</strong><code class="grow">Enlace público pendiente de publicación</code><span class="pill neutral">Vista previa</span></div>`}<section class="store-banner"><div><div class="eyebrow" style="color:#657b4e">Fruver & minimarket</div><h2>Lo fresco de cada día,<br>ahora a un mensaje.</h2><p>Elige tus favoritos y termina tu pedido por WhatsApp.</p></div><svg aria-hidden="true"><use href="#fruit-art"/></svg></section><div class="store-layout"><div><div class="toolbar"><div class="segmented">${['Todos','Combos','Frutas'].map(c=>`<button class="${storeCategory===c?'active':''}" onclick="storeCategory='${c}';navigate()">${c}</button>`).join('')}</div><span class="small muted">${filtered.length} opciones</span></div><div class="store-grid">${filtered.map((p,i)=>`<article class="store-product"><div class="product-art" style="background:${p.color||['#f0f1e0','#ecede4','#f3ebdf'][i%3]}"><svg aria-hidden="true"><use href="#${p.id<=5?'fruit-'+p.id:'fruit-art'}"/></svg></div><div><h3>${esc(p.name)}</h3><p>${p.unit==='combo'?p.description:'Precio por '+p.unit}</p><div class="between"><strong class="num">${money(p.price)}</strong><button class="btn" ${p.stock<=0?'disabled':''} onclick="addCart(${p.id})" aria-label="Agregar ${esc(p.name)}">${p.stock<=0?'Agotado':icon('plus')+' Añadir'}</button></div></div></article>`).join('')}</div></div><aside class="card cart" id="cart-panel">${cartPanel()}</aside></div>`}
function getItem(id){return products.find(p=>p.id===+id)||combos.find(c=>c.id===+id)}
function cartTotal(){return Object.entries(cart).reduce((n,[id,q])=>n+getItem(id).price*q,0)}
function cartPanel(){return `<div class="cardhead"><h2 class="label-icon">${icon('bag')}Tu pedido</h2><span class="pill neutral">${Object.keys(cart).length}</span></div>${Object.keys(cart).length?Object.entries(cart).map(([id,q])=>{const p=getItem(id);return `<div class="cart-item"><div class="grow"><p>${esc(p.name)}</p><small>${money(p.price*q)} · ${p.unit||'combo'}</small></div><div class="qty"><button aria-label="Quitar uno de ${esc(p.name)}" onclick="changeCart(${id},-1)">−</button><span>${q}</span><button aria-label="Añadir uno de ${esc(p.name)}" onclick="changeCart(${id},1)">+</button></div></div>`}).join(''):'<div class="cart-empty">Tu canasta está esperando.<br><span class="small">Añade un producto para comenzar.</span></div>'}<div class="between cart-total"><span>Subtotal</span><strong class="num">${money(cartTotal())}</strong></div><button class="btn primary" onclick="checkout()" ${!Object.keys(cart).length?'disabled':''}>Continuar pedido ${icon('arrow')}</button><p class="cart-note">Domicilio y peso final se confirman contigo.</p>`}
function stockRequirements(testCart){const req={};Object.entries(testCart).forEach(([id,q])=>{const c=combos.find(c=>c.id===+id);(c?c.items:[[+id,1]]).forEach(([pid,n])=>req[pid]=(req[pid]||0)+n*q)});return req}
function changeCart(id,delta){const temp={...cart,[id]:(cart[id]||0)+delta};if(temp[id]<=0)delete temp[id];const req=stockRequirements(temp);if(Object.entries(req).some(([pid,q])=>products.find(p=>p.id===+pid).stock<q)){toast('No hay existencias suficientes para esta combinación.');return}cart=temp;$('#cart-panel').innerHTML=cartPanel()}
function addCart(id){changeCart(id,1)}
function openDrawer(title,content){lastFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeDrawer()"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="between drawerhead"><h2 id="drawer-title">${title}</h2><button class="iconbtn" aria-label="Cerrar panel" onclick="closeDrawer()">${icon('close')}</button></div>${content}</section></div>`;document.body.style.overflow='hidden';$('.drawer .iconbtn').focus()}
function closeDrawer(){$('#modal-root').innerHTML='';document.body.style.overflow='';lastFocus?.focus()}
document.addEventListener('keydown',e=>{const d=$('.drawer');if(!d)return;if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const a=[...d.querySelectorAll('button:not(:disabled),a[href],input,select,textarea')],f=a[0],l=a[a.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
function replenish(){const list=low();const total=list.reduce((n,p)=>n+(p.target-p.stock)*p.cost,0);openDrawer('Lista de reposición',`<p class="desc">Completa el inventario hasta la cantidad objetivo. Costos de ejemplo, sujetos al precio del proveedor.</p><div class="detail-list">${list.map(p=>`<div class="detail-row"><div><strong>${esc(p.name)}</strong><p class="small muted">Comprar ${p.target-p.stock} ${p.unit} × ${money(p.cost)}</p></div><strong>${money((p.target-p.stock)*p.cost)}</strong></div>`).join('')}</div><div class="between"><span>Inversión estimada</span><strong class="num" style="font-size:26px">${money(total)}</strong></div><div class="drawerfoot"><button class="btn" onclick="closeDrawer()">Cerrar</button><button class="btn primary" onclick="downloadList()">${icon('download')}Descargar lista</button></div>`)}
function downloadList(){const content='\uFEFFProducto;Cantidad;Unidad;Costo unitario COP;Total COP\n'+low().map(p=>[p.name,p.target-p.stock,p.unit,p.cost,(p.target-p.stock)*p.cost].join(';')).join('\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='verdelia-reposicion-ejemplo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Lista de ejemplo descargada.')}
function productForm(id){const p=products.find(p=>p.id===id)||{name:'',category:'Frutas',unit:'kg',price:'',cost:'',stock:0,min:3,target:15};openDrawer(id?'Editar producto':'Añadir producto',`<p class="desc" style="margin-bottom:20px">Prueba el formulario. Los cambios de esta muestra se reinician al recargar.</p><form onsubmit="saveProduct(event,${id||0})"><label class="field">Nombre del producto<input name="name" required maxlength="70" value="${esc(p.name)}" placeholder="Ej. Mango de azúcar"></label><div class="fields2"><label class="field">Categoría<select name="category">${['Frutas','Verduras','Lácteos','Minimarket'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Se vende por<select name="unit">${['kg','lb','und','bandeja','botella','paquete'].map(x=>`<option ${p.unit===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="fields2"><label class="field">Costo por medida (COP)<input name="cost" type="number" min="0" step="1" required value="${p.cost}"></label><label class="field">Precio de venta (COP)<input name="price" type="number" min="1" step="1" required value="${p.price}"></label></div><label class="field">Existencias de ejemplo<input name="stock" type="number" min="0" step="0.01" required value="${p.stock}"></label><div class="fields2"><label class="field">Avisar al llegar a<input name="min" type="number" min="0" step="0.01" required value="${p.min}"></label><label class="field">Reponer hasta<input name="target" type="number" min="0.01" step="0.01" required value="${p.target}"></label></div><p class="small muted">Una medida por producto en esta muestra. Las conversiones se conectarán en el sistema final.</p><div class="drawerfoot"><button type="button" class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" type="submit">Guardar en la muestra</button></div></form>`)}
function saveProduct(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));for(const k of ['cost','price','stock','min','target'])d[k]=+d[k];if(d.target<=d.min){toast('La cantidad objetivo debe superar el mínimo de alerta.');return}if(!d.name.trim()){toast('Escribe el nombre del producto.');return}d.name=d.name.trim();if(id)Object.assign(products.find(p=>p.id===id),d);else products.push({...d,id:Math.max(...products.map(p=>p.id))+1,code:'PR-'+String(products.length+1).padStart(3,'0')});closeDrawer();navigate();toast('Producto guardado en esta muestra.')}
function comboDetail(id){const c=combos.find(c=>c.id===id);openDrawer(esc(c.name),`<p class="desc">Composición por cada combo vendido.</p><div class="detail-list">${c.items.map(([id,q])=>{const p=products.find(p=>p.id===id);return `<div class="detail-row"><div><strong>${p.name}</strong><p class="small muted">${number(q)} ${p.unit} por combo</p></div><strong>${money(q*p.cost)}</strong></div>`}).join('')}<div class="detail-row"><span>Empaque</span><strong>${money(c.pack)}</strong></div></div><div class="detail-row"><span>Costo total</span><strong>${money(costCombo(c))}</strong></div><div class="detail-row"><span>Precio al cliente</span><strong>${money(c.price)}</strong></div><div class="detail-row"><span>Ganancia bruta</span><strong style="color:var(--green)">${money(c.price-costCombo(c))}</strong></div><div class="banner" style="margin-top:20px">${icon('box')}Puedes preparar ${capacity(c)} combos con las existencias actuales.</div><div class="drawerfoot"><button class="btn primary" onclick="closeDrawer()">Entendido</button></div>`)}
function comboBuilder(){openDrawer('Crear un combo',`<p class="desc" style="margin-bottom:20px">Prueba una receta con hasta dos productos. En la versión final podrás añadir los ingredientes que necesites.</p><form onsubmit="saveCombo(event)"><label class="field">Nombre<input name="name" required maxlength="50" placeholder="Ej. Frutas para dos"></label>${[1,2].map(i=>`<div class="fields2"><label class="field">Producto ${i}<select name="p${i}">${products.map(p=>`<option value="${p.id}">${p.name} (${p.unit})</option>`).join('')}</select></label><label class="field">Cantidad<input name="q${i}" type="number" min="${i===1?'0.01':'0'}" step="0.01" value="${i===1?'1':'0'}" required></label></div>`).join('')}<div class="fields2"><label class="field">Empaque (COP)<input name="pack" type="number" min="0" step="1" value="1000" required></label><label class="field">Precio (COP)<input name="price" type="number" min="1" step="1" required></label></div><div class="drawerfoot"><button class="btn" type="button" onclick="closeDrawer()">Cancelar</button><button class="btn primary">Crear en la muestra</button></div></form>`)}
function saveCombo(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const amounts={};for(let i=1;i<=2;i++){if(+d['q'+i])amounts[d['p'+i]]=(amounts[d['p'+i]]||0)+ +d['q'+i]}combos.push({id:Math.max(...combos.map(c=>c.id))+1,name:d.name,description:'Tu nueva combinación de productos.',price:+d.price,pack:+d.pack,sold:0,items:Object.entries(amounts).map(([k,v])=>[+k,v]),color:'#e7edda'});closeDrawer();navigate();toast('Combo creado en esta muestra.')}
function orderDetail(id){const o=orders.find(o=>o.id===id);openDrawer('Pedido #'+o.id,`${pill(o.status,o.status==='Pendiente'?'warning':'positive')}<div class="detail-list"><div class="detail-row"><span>Cliente</span><strong>${o.customer}</strong></div><div class="detail-row"><span>Canal</span><strong>${o.channel}</strong></div><div class="detail-row"><span>Entrega</span><strong>${o.delivery}</strong></div><div class="detail-row"><span>Productos</span><strong>${esc(o.items)}</strong></div><div class="detail-row"><span>Total</span><strong>${money(o.amount)}</strong></div><div class="detail-row"><span>Pago</span><strong>${o.status==='Entregado'?'Recibido (ejemplo)':'Sin registrar'}</strong></div></div><p class="desc">En el sistema final podrás confirmar, cobrar, entregar o cancelar desde aquí. Esta vista no modifica pedidos reales.</p><div class="drawerfoot"><button class="btn primary" onclick="closeDrawer()">Cerrar detalle</button></div>`)}
function newSale(){saleCart={};openDrawer('Nueva venta',`<p class="desc" style="margin-bottom:20px">Venta de mostrador · Simulación</p><label class="field">Añadir producto<select id="sale-product" onchange="saleAdd(this.value);this.value='' "><option value="">Selecciona un producto…</option>${products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)}/${esc(p.unit)}</option>`).join('')}</select></label><div id="sale-lines"><div class="empty">Añade el primer producto.</div></div><div class="between" style="margin-top:20px"><h2>Total</h2><strong class="num" id="sale-total" style="font-size:28px">$0</strong></div><label class="field" style="margin-top:24px">Medio de pago<select id="sale-payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label><div class="drawerfoot"><button class="btn" onclick="closeDrawer()">Cancelar</button><button class="btn primary" onclick="finishSale()">Simular venta</button></div>`)}
function saleAdd(id){if(!id)return;saleCart[id]=(saleCart[id]||0)+1;renderSale()}
function renderSale(){$('#sale-lines').innerHTML=Object.entries(saleCart).map(([id,q])=>{const p=getItem(id);return `<div class="sale-line between"><div><h3>${esc(p.name)}</h3><span class="small muted">${money(p.price)} / ${p.unit}</span></div><label class="sr-only" for="qty-${id}">Cantidad de ${esc(p.name)}</label><input id="qty-${id}" aria-label="Cantidad de ${esc(p.name)}" type="number" min="0.01" step="0.01" value="${q}" onchange="saleCart[${id}]=+this.value;renderSale()"><button class="iconbtn" aria-label="Quitar ${esc(p.name)}" onclick="delete saleCart[${id}];renderSale()">${icon('close')}</button></div>`}).join('');$('#sale-total').textContent=money(Object.entries(saleCart).reduce((n,[id,q])=>n+getItem(id).price*q,0))}
function finishSale(){if(!Object.keys(saleCart).length){toast('Añade al menos un producto.');return}if(Object.entries(saleCart).some(([id,q])=>!Number.isFinite(q)||q<=0||q>getItem(id).stock)){toast('Revisa las cantidades y las existencias disponibles.');return}let total=0,cost=0;Object.entries(saleCart).forEach(([id,q])=>{const p=getItem(id);total+=p.price*q;cost+=p.cost*q;p.stock=Math.round((p.stock-q)*100)/100});demoSales+=total;demoCost+=cost;const method=$('#sale-payment').value;if(method==='Efectivo')demoCash+=total;else if(method==='Transferencia')demoTransfer+=total;else demoCard+=total;orders.unshift({id:'DEMO-'+(orders.length+1),customer:'Venta simulada',channel:'Local',amount:total,time:'14:35',status:'Entregado',items:Object.entries(saleCart).map(([id,q])=>`${number(q)} ${getItem(id).unit} de ${getItem(id).name}`).join(', '),delivery:'Local'});closeDrawer();navigate();toast('Venta simulada. Las existencias de ejemplo se actualizaron.')}
function expenseForm(){openDrawer('Registrar un gasto',`<p class="desc" style="margin-bottom:20px">Vista del formulario. Este ejemplo no guarda movimientos contables.</p><form onsubmit="event.preventDefault();closeDrawer();toast('Formulario revisado. El registro contable se conectará después de aprobar el diseño.')"><label class="field">Concepto<input required placeholder="Ej. Transporte de mercancía"></label><label class="field">Categoría<select><option>Transporte</option><option>Servicios</option><option>Arriendo</option><option>Otros gastos</option></select></label><div class="fields2"><label class="field">Valor (COP)<input type="number" min="1" required></label><label class="field">Medio de pago<select><option>Efectivo</option><option>Transferencia</option></select></label></div><div class="drawerfoot"><button class="btn" type="button" onclick="closeDrawer()">Cancelar</button><button class="btn primary">Probar formulario</button></div></form>`)}
function closeCash(){openDrawer('Cierre de caja',`<p class="desc">Cuenta el efectivo y compáralo con el saldo esperado.</p><div class="detail-list"><div class="detail-row"><span>Efectivo esperado</span><strong>${money(689400+demoCash)}</strong></div></div><label class="field">Efectivo contado (COP)<input type="number" min="0" placeholder="0" oninput="document.getElementById('difference').textContent=this.value===''?'—':money(+this.value-${689400+demoCash})"></label><div class="between"><span>Diferencia</span><strong class="num" id="difference">—</strong></div><p class="desc" style="margin-top:20px">Calculadora de ejemplo. El cierre definitivo se habilitará con la contabilidad conectada.</p><div class="drawerfoot"><button class="btn primary" onclick="closeDrawer()">Cerrar vista previa</button></div>`)}
function checkout(){openDrawer('Completa tu pedido',`<p class="desc" style="margin-bottom:20px">Prueba con datos ficticios. No se enviará información.</p><form onsubmit="previewMessage(event)"><label class="field">Tu nombre<input name="name" required placeholder="Nombre de ejemplo" autocomplete="off"></label><label class="field">Teléfono<input name="phone" type="tel" inputmode="tel" required placeholder="Número de ejemplo" autocomplete="off"></label><label class="field">¿Cómo lo recibes?<select name="delivery" onchange="document.getElementById('address-field').hidden=this.value!=='Domicilio';document.getElementById('delivery-address').required=this.value==='Domicilio'"><option>Recogida en el local</option><option>Domicilio</option></select></label><label class="field" id="address-field" hidden>Dirección<input id="delivery-address" name="address" placeholder="Dirección de ejemplo" autocomplete="off"></label><div class="detail-row"><span>Subtotal</span><strong>${money(cartTotal())}</strong></div><p class="small muted" style="margin-top:12px">El costo de domicilio y el peso final se confirmarían por WhatsApp.</p><div class="drawerfoot"><button class="btn" type="button" onclick="closeDrawer()">Volver</button><button class="btn primary">Ver mensaje de WhatsApp ${icon('arrow')}</button></div></form>`)}
function previewMessage(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const message=`¡Hola, Verdélia! Quiero hacer este pedido:\n\n${Object.entries(cart).map(([id,q])=>`${q} × ${getItem(id).name}: ${money(q*getItem(id).price)}`).join('\n')}\n\nSubtotal: ${money(cartTotal())}\nEntrega: ${d.delivery}${d.delivery==='Domicilio'?'\nDirección: '+d.address:''}\nNombre: ${d.name}\nTeléfono: ${d.phone}\n\nPor favor, confírmenme disponibilidad y total final.`;openDrawer('Así llegará el mensaje',`<p class="desc" style="margin-bottom:20px">Vista previa de WhatsApp · No se envía</p><div class="message-preview">${esc(message)}</div><p class="desc" style="margin-top:18px">En el sistema final, el botón abrirá WhatsApp con este mensaje. El cliente pulsará Enviar. El número de destino está pendiente de confirmar.</p><div class="drawerfoot"><button class="btn primary" onclick="closeDrawer()">Volver al catálogo</button></div>`)}
window.addEventListener('hashchange',()=>{closeDrawer();navigate();window.scrollTo(0,0)});navigate();
</script>
</body>
</html>
